<A NAME="win_double_click">To adjust the double-click speed for your mouse</A></P>

<OL>
<LI>Open <A ID="shortcut" HREF="exec=,rundll32.exe,shell32.dll,control_rundll main.cpl chm=ntshared.chm file=alt_url_windows_component.htm">Mouse</A> in Control Panel.</LI>
