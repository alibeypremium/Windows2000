To receive sound notification of new messages</h5>
<P>

<ol>
	<li>On the <b>Tools</b> menu, click <b>Options</b>.
</li>

	<p>
	<li>On the <b>General</b> tab, select <b>Play sound when new messages arrive</b>.</p>
