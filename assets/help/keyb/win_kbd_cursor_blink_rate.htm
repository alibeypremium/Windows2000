<A NAME="win_kbd_cursor_blink_rate">To adjust the cursor blink rate</A></P>

<OL>
<LI>Open <A ID="shortcut" HREF="exec=,rundll32.exe,shell32.dll,control_rundll main.cpl,keyboard, chm=ntshared.chm file=alt_url_windows_component.htm">Keyboard</A> in Control Panel.
</LI>

<LI>Drag the <B>Cursor blink rate</B> slider.</LI>

<P>
The test cursor to the left of the slider area blinks at the new rate.</P>
</OL>
