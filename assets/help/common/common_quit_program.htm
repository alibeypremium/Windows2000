<p class="proclabel">
<a name="common_quit_program">To quit a program</a></p>

<ul>
<li>On the <b>File</b> menu of the program you are using, click <b>Exit</b>.</li>
</ul>

<P CLASS="note">Note</p>

<ul>
<li> You can also quit a program by clicking <IMG SRC="../ntart/close.gif" ALT="close button"> at the far right of the title bar.</li>
</ul>
