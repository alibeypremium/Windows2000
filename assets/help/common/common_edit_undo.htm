<p class="proclabel">
<a name="common_edit_undo">To cancel your last action within a program</a></p>

<p>
<ul>
<li>On the <b>Edit</b> menu, click <b>Undo</b>.</li>
</ul></p>

<P CLASS="note">Notes</p>

<p>
<ul>
<li> Some actions you perform cannot be undone. If <b>Undo</b> is unavailable, you cannot cancel your last action.</li>
<li> Some programs can undo multiple actions, up to a certain limit.</li>
</ul></p>
