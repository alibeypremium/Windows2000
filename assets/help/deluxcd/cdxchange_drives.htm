<A NAME="CDXchange_drives"></A>
<P CLASS="proclabel">To switch to a different CD</P>
<UL>
<LI>Click <B>Disc</B>, and then click the CD you want to play.</LI>
</UL>
<P CLASS="note">Note</p>
<UL>
<LI>You must have more than one CD-ROM drive or a multidisc CD-ROM drive installed to change to another CD.</LI>
</UL>
