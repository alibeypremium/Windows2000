<A NAME="CDXchange_tracks"></A>
<P CLASS="proclabel">To change to a different track</P>
<UL>
<LI>Click <IMG SRC="../ntart/nextrack.gif" ALT="Next track button"> to move to the next track, or click <IMG SRC="../ntart/prvtrack.gif" ALT="Previous track button"> to move to the previous track.</LI>
</UL>
<P CLASS="note">Note</p>
<UL>
<LI>You can move forward or backward within a track by clicking <IMG SRC="../ntart/forward.gif" ALT="Forward button"> or <IMG SRC="../ntart/back.gif" ALT="Rewind button">.</LI>
</UL>
<P>
