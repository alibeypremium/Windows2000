<A NAME="CDXset_intro_length"></A>
<P CLASS="proclabel">To set the length of track introductions</P>
<OL>
<LI>Click <B>Options</B>, and then click <B>Preferences</B>.</LI>
<LI>On the <B>Player Options</B> tab, move the <B>Preview time</B> slider left or right to decrease or increase the length of time track introductions play.</LI>
</OL>
