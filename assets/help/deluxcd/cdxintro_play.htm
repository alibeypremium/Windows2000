<A NAME="CDXintro_play"></A>
<P CLASS="proclabel">To play track introductions</P>
<UL>
<LI>Click <IMG SRC="../ntart/mode.gif" ALT="Mode button">, and then click <B>Preview</B>.</LI>
</UL>
<P CLASS="note">Note</p>
<UL>
<LI>The five possible modes are <B>Standard</B>, <B>Random</B>, <B>Repeat Track</B>, <B>Repeat All</B>, and <B>Preview</B>. In Standard mode, CD Player plays each track in order, or plays your customized <A ID="wPopup" HREF="help=deluxcd.hlp topic=gls_play_list">playlist</A>.</LI>
</UL>
