<H1><A NAME="wgs_gs_ab009"></A>Stop Error 0x0000003F</H1>



<TABLE>

<TR>
<TD><B>Stop error number:</B></TD>
<TD>(0x0000003F)</TD>
</TR>

<TR>
<TD><B>Descriptive text:</B></TD>
<TD>NO_MORE_SYSTEM_PTES</TD>
</TR>

<TR>
<TD><B>Usual cause:</B></TD>
<TD>A driver isn't cleaning up correctly.</TD>
</TR>
</TABLE><BR>





<P class="proclabel"><B>To troubleshoot Stop error 0x0000003F</B></p>

<UL>
	<LI>Disable or uninstall any antivirus, disk defragmentation, or backup programs.



</li>
</UL>
