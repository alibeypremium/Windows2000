<H1><A NAME="wgs_gs__wgs_gspreface004"></A>If Windows Looks or Acts Differently</H1>



<P>Because Windows&nbsp;2000 is customizable, your copy may vary slightly from illustrations in this book. You may also notice slight differences in how Windows&nbsp;2000 responds&mdash;for example, whether you single-click or double-click to perform tasks.</p>
