<H3><A NAME="wgs_gs_01011"></A>Windows Update Web Site</H3>



<P>After you register your copy of Windows&nbsp;2000, you can use Windows Update to keep your copy of Windows&nbsp;2000 up-to-date. To download new system files, drivers, and so on, visit the Microsoft Windows Update Web site at:</p>

<P>
<A ID="extUrl" HREF="http://www.microsoft.com/isapi/redir.dll?prd=windowsupdate" TITLE="http://www.microsoft.com/" TARGET="_new">Microsoft Windows Update Web site</A></p></DIV></BODY>
