<H1><A NAME="wgs_gs_ab001"></A>Troubleshooting Stop Errors</H1>



<P>A Stop error, also known as a &quot;blue screen&quot; or a &quot;fatal system error,&quot; is a problem that causes Microsoft Windows&nbsp;2000 to stop responding. Stop errors occur on a blue or black background.</p>
