<H1><A NAME="wgs_gs_03003"></A>File Systems</H1>



<P>Before you install Windows&nbsp;2000, you should decide which file system you should use. A <I>file system</I> is the method by which information is stored on a hard disk.</p>



<P>Windows&nbsp;2000 supports the NTFS file system or one of the file allocation table file systems (FAT or FAT32).</p>
