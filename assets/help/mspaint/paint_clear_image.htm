<TITLE>Erase an entire image</TITLE>
<META NAME="MS-HAID" CONTENT="a_paint_clear_image">

<A NAME="paint_clear_image"></A><P CLASS="proclabel">To erase an entire image</P>

<OL>
<LI>If any part of the image is selected, click outside of the selected area.</LI>
<LI>On the <B>Image</B> menu, click <B>Clear Image</B>.</LI>
</OL>

<P CLASS="note">Note</p>

<UL>
<LI>The current <A ID="wPopup" HREF="help=mspaint.hlp topic=gl_pbrush_back">background color</A> will be used to fill the cleared area.</LI></UL>
<P>
<A ID="relTopics" HREF="#" data-haid="a_paint_erase_small;a_paint_erase_large">Related Topics</A></P>
