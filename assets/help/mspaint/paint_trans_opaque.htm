<A NAME="paint_trans_opaque"></A><P CLASS="proclabel">To specify opaque or transparent drawing</P>
<P>

<UL>
<LI> To draw <A ID="wPopup" HREF="help=mspaint.hlp topic=gl_pbrush_opaque_def">opaque</A>, under <B>Image</B>, click <B>Draw Opaque</B> and make sure a check mark appears next to it. To specify <A ID="wPopup" HREF="help=mspaint.hlp topic=gl_pbrush_transparent_def">transparent</A> drawing, clear the check mark next to <B>Draw Opaque</B>.</LI>
</UL>
</P>
