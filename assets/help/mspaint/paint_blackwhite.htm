<TITLE>Use black and white instead of color</TITLE>
<META NAME="MS-HAID" CONTENT="a_paint_blackwhite">
<LINK REL="stylesheet" MEDIA="screen" TYPE="text/css" HREF="../ntshared/coua.css"><LINK REL="stylesheet" MEDIA="print" TYPE="text/css" HREF="../ntshared/couaprint.css"></HEAD>
<BODY>
<A NAME="paint_blackwhite"></A><P CLASS="proclabel">To use black and white instead of color</P>

<OL>
<LI>
On the <B>Image</B> menu, click <B>Attributes</B>.</LI>
<LI>
Under <B>Colors</B>, click <B>Black and white</B>.</LI>
</OL>

<P CLASS="note">Note</p>

<UL>
<LI>If you change back to color, only new work will be in color.</LI></UL>

<P><A ID="relTopics" HREF="mspaint.chm meta=a_paint_custom_colors;a_paint_change_color">Related Topics</A></P>
