<P CLASS="proclabel"><A NAME="sol_scoring">To choose a scoring system</A></P>
<OL>
<LI>On the <B>Game</B> menu, click <B>Options</B>.</LI>

<LI>Under <B>Scoring</B>, click <A ID="wPopup" HREF="help=sol.hlp topic=standard_score">Standard</A>,  <A ID="wPopup" HREF="help=sol.hlp topic=vegas_score">Vegas</A>, or <A ID="wPopup" HREF="help=sol.hlp topic=none_score">None</A>. </LI>
</OL>

<P CLASS="note">Note</P>

<UL>
<LI>On the <B>Game</B> menu, click <B>Options</B> to specify whether to draw one or three cards at a time. These options are scored slightly differently.</LI>
</UL>
