<P CLASS="proclabel"><A NAME="print_stop_sharing">To stop sharing your printer</A></P>

<OL>
<LI><SPAN CLASS="reuse" ID="printing1"></SPAN></LI>

<LI>Right-click the printer you want to stop sharing, and then click <B>Sharing</B>.</LI>

<LI>On the <b>Sharing</b> tab, click <B>Not Shared</B>.</LI>
</OL>
