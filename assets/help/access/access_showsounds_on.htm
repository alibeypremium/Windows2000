<TITLE>Turn on ShowSounds</TITLE>

<P CLASS="proclabel">
<A NAME="access_showsounds_on">To turn on ShowSounds</A></P>
<OL>
<LI><SPAN CLASS="reuse" ID="access2"></SPAN></li>
<li>On the <b>Sound</b> tab, under <b>ShowSounds</b>, select the <B>Use ShowSounds</B> check box.</LI>
</OL>
<P CLASS="note">Note</p>
<UL>
<LI>To open Accessibility Options, click <b>Start</b>, point to <b>Settings</b>, click <b>Control Panel</b>, and then double-click <b>Accessibility Options</b>.</LI>
</UL>
<p><A ID="relTopics" HREF="#" data-haid="a_soundsentry;a_access_cpanel_overview;a_accessibility_options_installs;a_osk_overview">Related Topics</A></p>
