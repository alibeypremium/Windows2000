<P CLASS="proclabel"><A NAME="calc_separator">To use digit grouping</A></P>

<UL>
<LI> On the <B>View</B> menu, click <B>Digit grouping</B>.</LI>
</UL>

<P CLASS="note">Notes</p>
<UL>
<LI>You can use digit grouping to view numbers as logically grouped.</LI>
<LI>Calculator uses commas to group decimal numbers, and spaces to group <A ID="wPopup" HREF="help=glossary.hlp topic=gls_hexa_decimal">hexadecimal</A> numbers.</LI>
</UL>
