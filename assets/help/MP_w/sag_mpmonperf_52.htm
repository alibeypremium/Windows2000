<H1>Monitoring WINS </H1>
<P>
WINS installs the WINS Server performance object for monitoring service activity. The WINS Server performance counters are cleared each time you start and stop the service.</P>
<P>For more information about WINS performance counters, see <A ID="altLoc" HREF="CHM=WINSconcepts.chm;nofts.chm FILE=sag_wins_add_perfmonreference.htm;server_specific.htm">WINS performance monitoring reference</A>.</P>
