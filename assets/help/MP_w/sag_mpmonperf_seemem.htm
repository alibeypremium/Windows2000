<P CLASS="proclabel">To determine the amount of RAM on your computer</P>

<OL>
<LI>On the Windows&nbsp;2000 desktop, right-click <B>My Computer</B> and click <B>Properties</B>.</LI>

<LI>On the <B>General</B> tab, the amount of memory in kilobytes (KB) appears beneath the <B>Computer</B> information.</LI>
</OL>
