<P CLASS="proclabel"><A NAME="term_call_remote"></A>To use a saved connection to call a remote computer</P>

<OL>
<LI>On the <B>File</B> menu, click <B>Open</B>.</LI>

<LI>In the <B>File name</B> box, type or select the name of the connection you want to use.</LI>

<LI>Click <B>Open</B>, and then click <B>Dial</B>.</LI>
</OL>

<P class="note">Note</P>
<UL>
<LI>
HyperTerminal connections are saved using the .ht extension.
</LI>
</UL>
