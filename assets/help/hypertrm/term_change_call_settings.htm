<P CLASS="proclabel"><A NAME="term_change_call_settings"></A>To change the settings for making a call</P>

<OL>
<LI>On the <B>File</B> menu, click <B>Properties</B>.</LI>

<LI>Click the <B>Connect To</B> and <B>Settings</B> tabs to see the available choices, and make your changes.</LI>
