<a name="run_icw"></a>To set up an Internet connection</p>
<ol>
    <li>On the <B>Tools</B> menu in Internet Explorer, click <B>Internet Options</B>.</li>
    <li>Click the <b>Connections </b>tab, and then click <B>Setup</B>.</li>
    <li>Follow the instructions on your screen.</li>
</ol>
