<p class=proclabel>
<a name="prevfast"></a>To create more space for temporary Internet pages</p>
<ol>
    <li>On the <B>Tools</b> menu in Internet Explorer, click <b>Internet Options</b>.</li>
    <li>On the <b>General </b>tab, click <b>Settings</b>.</li>
    <li>To create more space to store pages temporarily, move the slider to the right.</li>
</ol>
