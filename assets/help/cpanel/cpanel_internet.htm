<H1>
<A NAME="cpanel_internet">Internet Options</A></H1>
<p>This Control Panel component opens the <b>Internet Properties</b> dialog box, where Internet properties can be changed. These properties are organized under six tabs: <b>General</b>, <b>Security</b>, <b>Content</b>, <b>Connections</b>, <b>Programs</b>, and <b>Advanced</b>. For more information, see <A ID="specLoc" HREF="../ntchowto/app_iexplorer.htm">Using Internet Explorer</A>.</p>
