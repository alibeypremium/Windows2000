<P CLASS="proclabel"><A NAME="regedit_import">To import some or all of the registry</A></P>
<OL>
<LI>
On the <B>Registry</B> menu, click <B>Import Registry File</B>.</LI>
<LI>
Find the file you want to import, click the file to select it, then click <B>Open</B>.</LI>
</OL>
