<P CLASS="procLabel">To view the call log</P>
<uL>
    
    <LI>
    Click the <B>View</b> menu, and then click <b>Call Log</b>.
    </LI>
   
</uL>

<P class="note">Note</P>
<UL>


    <LI>
    A separate window opens in <b>Notepad</b> to show you all incoming and outgoing calls and conferences for the last 30 days. 
    </LI>
  
 
</UL>
