<A NAME="osk_click_sound"></A><P CLASS="proclabel">To use an audible click</P>
<OL>
<LI><SPAN CLASS="reuse" ID="osk3"></span></li>
<LI>On the <B>Settings</B> menu, choose <B>Use Click Sound</B>.</LI>
</OL>
<P CLASS="note">Notes</p>
<UL>
<LI><SPAN CLASS="reuse" ID="osk4"></span></li>
<li>The audible click sound is heard when the character selected appears in the program being used.</li>
<LI><SPAN CLASS="reuse" ID="osk5"></span></LI>
</UL>
