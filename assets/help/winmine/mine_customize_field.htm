<P CLASS="proclabel"><A NAME="mine_customize_field">To customize the playing field</A></P>

<OL>
<LI>On the <B>Game</B> menu, click <B>Custom</B>.</LI>

<LI>Customize the size of the field by specifying the number of squares to display vertically and horizontally, and specify the number of mines to place on the field.</LI>
</OL>
