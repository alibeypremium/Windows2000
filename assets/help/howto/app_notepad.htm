<H1><A NAME="app_notepad">Using Notepad</A></H1>
<P>Notepad is a basic text editor that you can use for simple documents or for creating Web pages. To create or edit files that require formatting, use WordPad.</P>
<P>Open <A ID="shortcut" HREF="exec=notepad,notepad.exe,, chm=ntshared.chm file=alt_url_windows_component.htm">Notepad</A>.</P>
