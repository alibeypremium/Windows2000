<P CLASS="proclabel"><A NAME="clear_how_cb"></A>To clear the contents of the Clipboard</P>

<OL>
<LI>In ClipBook Viewer, click the Clipboard window.</LI>
<LI>On the <B>Edit</B> menu, click <B>Delete</B>.</LI>
<LI>Click <B>Yes</B>.</LI>
</OL>

<P CLASS="note">Note</p>
<UL>
<LI>Because the Clipboard stores information in multiple formats, clearing it may free some memory.</LI>
</UL>
