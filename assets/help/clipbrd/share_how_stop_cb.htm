<P CLASS="proclabel"><A NAME="share_how_stop_cb"></A>To stop sharing a local ClipBook page</P>

<OL>
<LI>In the local ClipBook window, click the ClipBook page you want to stop sharing.</LI>
<LI>On the <B>File</B> menu, click <B>Stop Sharing</B>.</LI>
</OL>
