<A NAME="taskman_start_new"></A><P CLASS="PROCLABEL">To start a new program</P>

<OL>
<LI>On the <B>Applications</B> tab, click <B>New Task</B>.</LI>
<LI>In <B>Open</B>, type the location and name of the program you want, and then click <B>OK</B>.</LI>
</OL>

<P CLASS="note">Note</p>
<UL>
<LI><B>New Task</B> is identical to the <B>Run</B> command on the <B>Start</B> menu.</LI>

</UL>
