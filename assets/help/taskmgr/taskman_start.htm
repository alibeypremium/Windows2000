<BODY>
<A NAME="taskman_start"></A><P CLASS="PROCLABEL">To start Task Manager</P>

<UL>
<LI>Right-click an empty area of the taskbar, and then click <B>Task Manager</B>.</LI>
</UL>
<P CLASS="note">Notes</p>
<UL>
<LI> You can also start Task Manager by pressing CTRL+ALT+DELETE and then clicking <B>Task Manager</B>.</LI>
<LI> You can also start Task Manager by pressing CTRL+SHIFT+ESC.</LI>
</UL>

</BODY>
