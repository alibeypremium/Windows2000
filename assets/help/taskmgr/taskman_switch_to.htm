<A NAME="taskman_switch_to"></A><P CLASS="PROCLABEL">To switch to another program</P>

<OL>
<LI>On the <B>Applications</B> tab, click the program you want to switch to.</LI>
<LI>Click <B>Switch To</B>.</LI>
</OL>

<P CLASS="note">Note</p>
<UL>
<LI> To open Task Manager, right-click an empty space on the taskbar, and then click <B>Task Manager</B>.</LI>
</UL>
