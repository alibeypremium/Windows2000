<A NAME="taskman_view_more"></A><P CLASS="PROCLABEL">To display other process counters</P>

<OL>
<LI>On the <B>Processes</B> tab, click <B>View</B>, and then click <B>Select Columns</B>.</LI>
<LI>Click the items you want to appear as column headings, and then click <B>OK</B>.</LI>
</OL>

<P CLASS="note">Note</p>
<UL>
<LI>For more information about the process counters, see Related Topics.</LI>
</UL>
