<A NAME="hide_show_help_contents">To hide or show the Help navigation pane</A></P>
<UL>
<LI>On the Help toolbar, click&nbsp;<IMG SRC="../ntart/hide.gif" ALT="Hide button">&nbsp;to hide the navigation pane, which includes the <B>Contents</B>, <B>Index</B>, <B>Search</B>, and <B>Favorites</B> tabs.</LI>
<LI>On the Help toolbar, click&nbsp;<IMG SRC="../ntart/show.gif" ALT="Show button">&nbsp;to display the navigation pane.</LI>
</UL>
